# Next.js:
#   CRUD + dashboard -> Rails direto (TanStack Query/Form + SSE)
#
networks:
  backend:

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    # Dev mode has shown intermittent RSC Client Manifest issues in Docker volumes.
    # Use build+start for stability in the POC.
    # Dev flow: serve directly with `next dev` for fast startup inside Docker.
    # (Production build can be run outside compose when needed.)
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_RAILS_URL: http://localhost:3000
      RAILS_INTERNAL_URL: http://app:3000
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    networks:
      - backend
    depends_on:
      env-sync:
        condition: service_completed_successfully
      app:
        condition: service_started

volumes:
  web_node_modules:
